name: Obsidian plugin release

# Obsidian and BRAT look for a GitHub release whose tag is exactly the plugin
# version (no "v" prefix) carrying main.js, manifest.json and styles.css.
# Python releases use v* tags, so the two never collide.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: obsidian-plugin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: obsidian-plugin/package-lock.json

      - name: Check tag matches manifest versions
        run: |
          tag="${GITHUB_REF_NAME}"
          for f in manifest.json ../manifest.json; do
            v=$(node -p "require('./$f').version")
            if [ "$v" != "$tag" ]; then
              echo "::error::$f has version $v but the tag is $tag"
              exit 1
            fi
          done

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
            --title "Obsidian plugin $GITHUB_REF_NAME" \
            --notes "Install with BRAT (add krxsh007/constellation) or copy main.js, manifest.json and styles.css into <vault>/.obsidian/plugins/constellation/."
