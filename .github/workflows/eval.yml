name: Eval

# Replays the recorded link-quality evaluation (no API keys, no network calls to
# model providers) and fails if the default pipeline's F1 drops more than 5
# points below eval/baseline.json.

on:
  push:
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Replay eval and check baseline
        run: python eval/run_eval.py --replay --check-baseline
