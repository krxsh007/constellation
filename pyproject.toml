[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "constellation"
version = "0.2.0"
description = "A local Streamlit app that organizes your Obsidian vault by adding LLM-extracted tags and semantic wikilinks."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.49.1,<2",
    "langgraph>=1.2.11,<2",
    "langchain-core>=1.6.1,<2",
    "langchain-community>=0.4.2,<0.5",
    "langchain-groq>=1.1.3,<2",
    "langchain-google-genai>=4.4.0,<5",
    "faiss-cpu>=1.15.0,<2",
    "pydantic>=2.13.5,<3",
    "python-dotenv>=1.2.3,<2",
    "requests>=2.32.5,<3",
]

[project.optional-dependencies]
ollama = ["langchain-ollama>=1.0,<2"]
dev = ["ruff", "pytest"]

[project.scripts]
constellation = "main:cli"

[tool.setuptools]
py-modules = ["main", "app"]

[tool.setuptools.packages.find]
include = ["constellation*"]

[tool.setuptools.package-data]
"constellation.ui" = ["*.css", "*.html"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.format]
# New code is held to `ruff format`. These modules predate the formatter and use
# hand-aligned hanging indents; they are listed here until they get one
# dedicated reformat commit, so the reformat doesn't collide with in-flight work.
exclude = [
    "app.py",
    "constellation/core/backup.py",
    "constellation/core/config.py",
    "constellation/core/prompts.py",
    "constellation/core/state.py",
    "constellation/core/utils.py",
    "constellation/core/vectorstore.py",
    "constellation/nodes/concepts.py",
    "constellation/nodes/io.py",
    "constellation/nodes/relations.py",
    "constellation/ui/components.py",
    "constellation/ui/helpers.py",
    "main.py",
    "obsidian-plugin/scripts/gen_parity_fixture.py",
    "scripts/monitor_keys.py",
    "scripts/run_local.py",
    "tests/test_app_smoke.py",
    "tests/test_e2e.py",
    "tests/test_features.py",
    "tests/test_llm_parsing.py",
    "tests/test_notes.py",
    "tests/test_pipeline_fixes.py",
    "tests/test_safety.py",
    "tests/test_vectorstore.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
# E501: line length is advisory; E741: short comprehension names; B905: zip() strictness is not needed here
ignore = ["E501", "E741", "B905"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]
# Standalone fixture generator; its import order is part of the plugin port and left as is.
"obsidian-plugin/scripts/*.py" = ["I001"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.11"
# The codebase uses `x: str = None` for optional arguments throughout.
strictParameterNoneValue = false
# Shipped code only: the tests deliberately hand nodes partial state dicts and
# monkeypatch modules, which is exactly what a type checker objects to.
include = ["constellation", "main.py", "app.py", "scripts"]
exclude = ["**/node_modules", "**/__pycache__", "obsidian-plugin", "build", "dist"]
