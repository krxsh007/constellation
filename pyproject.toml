[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "constellation"
version = "0.2.0"
description = "A local Streamlit app that organizes your Obsidian vault by adding LLM-extracted tags and semantic wikilinks."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.49.1,<2",
    "langgraph>=1.2.11,<2",
    "langchain-core>=1.6.1,<2",
    "langchain-community>=0.4.2,<0.5",
    "langchain-groq>=1.1.3,<2",
    "langchain-google-genai>=4.4.0,<5",
    "faiss-cpu>=1.15.0,<2",
    "pydantic>=2.13.5,<3",
    "python-dotenv>=1.2.3,<2",
    "requests>=2.32.5,<3",
]

[project.optional-dependencies]
ollama = ["langchain-ollama>=1.0,<2"]
dev = ["ruff", "pytest"]

[project.scripts]
constellation = "main:cli"

[tool.setuptools]
py-modules = ["main", "app"]

[tool.setuptools.packages.find]
include = ["constellation*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
# E501: line length is advisory; E741: short comprehension names; B905: zip() strictness is not needed here
ignore = ["E501", "E741", "B905"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]
