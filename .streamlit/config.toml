[theme]
base = "dark"
primaryColor = "#6b5be6"
backgroundColor = "#0d0e11"
secondaryBackgroundColor = "#15161a"
textColor = "#ececef"
linkColor = "#9d8ff8"
borderColor = "#25272d"
codeBackgroundColor = "#111216"
dataframeHeaderBackgroundColor = "#15161a"
font = "Inter, sans-serif"
codeFont = "'JetBrains Mono', monospace"
baseRadius = "7px"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#101114"
secondaryBackgroundColor = "#15161a"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
